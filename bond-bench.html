<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bond Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#E7ECE8; --panel:#F8FAF7; --inset:#EEF2EE; --ink:#14222E; --ink2:#47596A; --line:#C4CFC8;
  --accent:#14222E; --accent-ink:#F8FAF7; --focus:#2F6BFF; --cell-ink:#14222E;
  --lp:#C2364A; --dneg:#C2364A; --dpos:#2A5BD7;
  --t-ionic:#7A3FB8; --t-polar:#0B7480; --t-nonpolar:#3F7D22; --t-metallic:#A15F00; --t-network:#8A3B3B;
  --c-alk:#F5B5A4; --c-ake:#F4D38B; --c-tm:#B8D0EE; --c-ptm:#A9D6CB; --c-mtl:#D6DC9E;
  --c-nm:#B5E3A0; --c-hal:#F0BCE0; --c-ng:#CDBFF2; --c-lan:#F8D7C0; --c-act:#E6C4D8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A22; --panel:#15242E; --inset:#1B2D39; --ink:#E8F0F3; --ink2:#9DB0BD; --line:#2A3C48;
    --accent:#E8F0F3; --accent-ink:#0E1A22; --focus:#7FA6FF; --cell-ink:#F2F6F7;
    --lp:#FF7A8C; --dneg:#FF7A8C; --dpos:#7FA6FF;
    --t-ionic:#B994EA; --t-polar:#4FC3CC; --t-nonpolar:#8FCB6A; --t-metallic:#E8A63C; --t-network:#E58A8A;
    --c-alk:#8A4A3D; --c-ake:#86702F; --c-tm:#3C5F8A; --c-ptm:#2E6B5E; --c-mtl:#6A7030;
    --c-nm:#40703A; --c-hal:#8A4A7C; --c-ng:#5D5190; --c-lan:#8A6248; --c-act:#7E5370;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A22; --panel:#15242E; --inset:#1B2D39; --ink:#E8F0F3; --ink2:#9DB0BD; --line:#2A3C48;
  --accent:#E8F0F3; --accent-ink:#0E1A22; --focus:#7FA6FF; --cell-ink:#F2F6F7;
  --lp:#FF7A8C; --dneg:#FF7A8C; --dpos:#7FA6FF;
  --t-ionic:#B994EA; --t-polar:#4FC3CC; --t-nonpolar:#8FCB6A; --t-metallic:#E8A63C; --t-network:#E58A8A;
  --c-alk:#8A4A3D; --c-ake:#86702F; --c-tm:#3C5F8A; --c-ptm:#2E6B5E; --c-mtl:#6A7030;
  --c-nm:#40703A; --c-hal:#8A4A7C; --c-ng:#5D5190; --c-lan:#8A6248; --c-act:#7E5370;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{max-width:1400px;margin:0 auto;padding:16px 20px 32px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}}

/* Periodic table */
.table-wrap{container-type:inline-size;background:var(--panel);border-radius:16px;padding:14px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:repeat(7,auto) 10px repeat(2,auto);gap:3px}
.intro{grid-column:3/13;grid-row:1/4;position:relative}
.intro>div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 6px 0 10px}
.intro h1{font-family:var(--display);font-weight:700;margin:0;line-height:1.02;font-size:26px;font-size:clamp(20px,4.6cqw,42px);letter-spacing:-.01em}
.intro p{margin:6px 0 0;color:var(--ink2);font-size:12px;font-size:clamp(11px,1.9cqw,16px);line-height:1.3}
.el{aspect-ratio:1;border:0;border-radius:6px;padding:0;background:var(--cat);color:var(--cell-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;line-height:1;transition:transform .12s ease}
.el .n{font-size:8px;font-size:clamp(6px,1.45cqw,10px);opacity:.72}
.el .s{font-family:var(--display);font-weight:700;font-size:14px;font-size:clamp(10px,2.6cqw,22px)}
.el:active{transform:scale(.94)}
.el[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px;transform:scale(1.07);z-index:2}
.el:focus-visible{outline:3px solid var(--focus);outline-offset:2px;z-index:3}
@media (hover:hover){.el:hover{transform:scale(1.08);z-index:2}}
.ph{aspect-ratio:1;border-radius:6px;background:var(--cat);opacity:.55;display:flex;align-items:center;justify-content:center;font-size:7px;font-size:clamp(5px,1.25cqw,10px);color:var(--cell-ink);text-align:center;line-height:1.05}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;padding:0;margin:14px 2px 0;font-size:13px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--cat);display:inline-block}

/* Bench */
.bench{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
@media (min-width:961px){.bench{position:sticky;top:12px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;overscroll-behavior:contain}}
.slots{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.plus{font-family:var(--display);font-size:26px;color:var(--ink2)}
.slot{min-height:118px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;position:relative;color:var(--ink2);font-size:13px;line-height:1.25}
.slot.filled{border:2px solid transparent;background:var(--cat);color:var(--cell-ink)}
.slot .big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1}
.slot .nm{font-size:15px;font-weight:600;margin-top:2px}
.slot .meta{font-size:12px;opacity:.8;margin-top:2px}
.slot .x{position:absolute;top:2px;right:2px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;color:inherit;font-size:22px;line-height:1;cursor:pointer}
.slot .x:focus-visible{outline:3px solid var(--focus)}
.actions{display:flex;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;min-height:48px;padding:0 18px;font:600 16px/1 var(--body);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.grow{flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn:active:not(:disabled){transform:scale(.98)}
.quick p{margin:0 0 8px;color:var(--ink2);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--inset);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font:500 15px/1 var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--panel);font-weight:600}
.chip sub{font-size:.75em}

/* Result */
.result{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:14px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 12px}
.formula{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;letter-spacing:-.01em}
.formula.long{font-size:30px}
.formula sub{font-size:.6em;line-height:0}
.cname{color:var(--ink2);font-size:16px;margin-top:4px}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--t);border:1.5px solid var(--t);background:rgba(0,0,0,.05);background:color-mix(in srgb,var(--t) 14%,transparent);white-space:nowrap}
.dia{width:100%;height:auto;max-height:270px;display:block;background:var(--inset);border-radius:14px;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.cap{margin:-6px 2px 0;color:var(--ink2);font-size:12.5px}
.gauge .track{display:flex;height:10px;border-radius:999px;overflow:visible;position:relative}
.gauge .seg{display:block;height:100%}
.gauge .seg:first-child{border-radius:999px 0 0 999px}
.gauge .seg:nth-child(3){border-radius:0 999px 999px 0}
.gauge .seg.np{flex:.4;background:var(--t-nonpolar)}
.gauge .seg.po{flex:1.3;background:var(--t-polar)}
.gauge .seg.io{flex:1.6;background:var(--t-ionic)}
.gauge .mark{position:absolute;top:-7px;width:0;height:0;margin-left:-7px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--ink)}
.gauge .gl{display:flex;font-size:12px;color:var(--ink2);margin-top:5px}
.gauge .gl span:nth-child(1){flex:.4}
.gauge .gl span:nth-child(2){flex:1.3}
.gauge .gl span:nth-child(3){flex:1.6;text-align:right}
.gauge .den{margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
.note{margin:0;font-size:13px;color:var(--ink2);background:var(--inset);border-radius:10px;padding:9px 12px}
.card p{margin:0}
.details{display:grid;gap:16px;animation:pop .3s ease}
.details h3{font-family:var(--display);font-weight:700;font-size:18px;margin:0 0 6px}
.details p{margin:0 0 8px}
.details p:last-child{margin-bottom:0}
.details ul{margin:0;padding-left:20px;display:grid;gap:6px}
dl.props{margin:0;display:grid}
.props .r{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.props .r:first-child{border-top:0}
.props dt{color:var(--ink2);font-size:13.5px}
.props dd{margin:0}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
.e{animation:drift 3.2s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}

/* ---------- Shell ---------- */
:root{--link:#B86B00;--sel:#2F6BFF;--bench:#EEF2EE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--link:#F0A83C;--sel:#7FA6FF;--bench:#12212B}}
:root[data-theme="dark"]{--link:#F0A83C;--sel:#7FA6FF;--bench:#12212B}
.shell{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;width:100%;max-width:1600px;margin:0 auto;padding:12px 20px 0}
.ver{font:600 12px/1 var(--body);color:var(--ink2);background:var(--inset);border-radius:999px;padding:4px 8px;vertical-align:middle;letter-spacing:0}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;line-height:1;margin:0 auto 0 0}
.tabs{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--ink);font:600 15px/1 var(--body);min-height:42px;padding:0 18px;border-radius:9px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:focus-visible,.tb:focus-visible,.atom-btn:focus-visible,.mol-btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hand-btn{min-height:46px;font-size:15px}
.hand-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;width:100%;max-width:1600px;margin:0 auto;padding:12px 20px 20px;min-height:0}
.view[hidden]{display:none!important}
.intro h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.02;font-size:24px;font-size:clamp(18px,4cqw,36px);letter-spacing:-.01em}

/* ---------- Build layout ---------- */
.build{flex:1;display:grid;grid-template-columns:228px minmax(0,1fr) 320px;gap:14px;min-height:520px}
@media (min-width:901px){
  body.mode-build .shell{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .build{min-height:0}
}
@media (min-width:901px) and (max-width:1180px){.build{grid-template-columns:208px minmax(0,1fr) 280px}}
.shelf,.binfo{background:var(--panel);border-radius:16px;overflow:auto;overscroll-behavior:contain;min-height:0}
.shelf{padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:3px;background:var(--inset);border-radius:10px;padding:3px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink);font:600 14px/1 var(--body);min-height:38px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line)}
.pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;touch-action:pan-y;align-content:start}
.pal[hidden]{display:none}
.atom-btn{appearance:none;aspect-ratio:1/1;border:0;border-radius:12px;background:var(--f);color:var(--k);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:grab;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.2);padding:0;transition:transform .1s ease}
.atom-btn .s{font:700 22px/1 var(--display)}
.atom-btn .n{font-size:10.5px;line-height:1;opacity:.9}
.atom-btn:active,.mol-btn:active,.hand-press{transform:scale(.95)}
.all-btn{grid-column:1/-1;appearance:none;border:1.5px dashed var(--line);background:transparent;color:var(--ink);border-radius:12px;min-height:46px;font:600 14px/1 var(--body);cursor:pointer}
.grp{grid-column:1/-1;font:700 14px/1.2 var(--display);margin:8px 2px 0;color:var(--ink2)}
.grp:first-child{margin-top:0}
.mol-btn{grid-column:1/-1;appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--inset);color:var(--ink);border-radius:12px;min-height:52px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;cursor:grab;transition:transform .1s ease}
.mol-btn b{font-weight:600;font-size:15px;line-height:1.15}
.mol-btn span{font-size:12.5px;color:var(--ink2);line-height:1.2}
.shelf-note{margin:2px 2px 0;font-size:12.5px;color:var(--ink2);line-height:1.35}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--bench);box-shadow:inset 0 0 0 1.5px var(--line);touch-action:none;min-height:0}
#bcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.tb{pointer-events:auto;appearance:none;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;min-height:40px;padding:0 13px;font:600 14px/1 var(--body);cursor:pointer}
.tb:disabled{opacity:.4;cursor:default}
.tb[aria-pressed="true"]{background:#E5483A;border-color:#E5483A;color:#fff}
.tb:active:not(:disabled){transform:scale(.96)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s ease}
.toast.show{opacity:1}
.binfo{padding:16px;display:flex;flex-direction:column;gap:14px}
.binfo p{margin:0}
.binfo h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0 0 6px}
.ih{font-family:var(--display);font-weight:700;font-size:21px;margin:0;line-height:1.1}
.muted{color:var(--ink2);font-size:13.5px}
.selline{font-size:14px;background:var(--inset);border-radius:10px;padding:9px 12px}
.blist{list-style:none;margin:0;padding:0;display:grid}
.blist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.blist li:first-child{border-top:0}
.blist .k{color:var(--ink2);text-align:right}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:44px;font-size:15px;padding:0 14px}
.expl{display:grid;gap:8px}
.expl p{font-size:14.5px}
.spare{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--inset);border-radius:12px;padding:10px 12px;font-size:14px}
.spare .btn{min-height:40px;font-size:14px}
.chip:disabled{opacity:.35;cursor:default}
@media (max-width:900px){
  .build{grid-template-columns:minmax(0,1fr);min-height:0}
  .shelf{overflow:visible}
  .pal{grid-auto-flow:column;grid-template-columns:none;grid-template-rows:repeat(2,auto);grid-auto-columns:66px;overflow-x:auto;touch-action:pan-x;padding-bottom:6px}
  .pal.mols{grid-auto-columns:158px}
  .pal .grp,.shelf-note{display:none}
  .mol-btn,.all-btn{grid-column:auto}
  .all-btn{grid-row:span 2;min-height:0}
  .stage{height:58vh;min-height:380px}
  .binfo{overflow:visible}
}

/* ---------- All-elements overlay ---------- */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,16,22,.5);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.open{display:flex}
.ov-panel{width:min(1100px,100%);max-height:100%;overflow:auto;background:var(--panel);border-radius:18px;padding:14px}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 10px}
.ov-head h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0}
.ov-panel .table-wrap{padding:0}

/* ---------- Drag ghost + hand control ---------- */
#ghost{position:fixed;left:0;top:0;z-index:55;pointer-events:none;display:none;align-items:center;justify-content:center}
#ghost.g-atom{width:46px;height:46px;border-radius:50%;font:700 19px/1 var(--display);box-shadow:0 0 0 2px var(--ink)}
#ghost.g-mol{padding:9px 13px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;white-space:nowrap}
.hcur{position:fixed;left:0;top:0;z-index:60;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--hc);background:rgba(255,255,255,.12);box-shadow:0 0 0 2px rgba(0,0,0,.4);pointer-events:none;display:none;transition:width .08s,height .08s,margin .08s,background .08s}
.hcur::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--hc);opacity:.6;transform:scale(var(--p,0));transition:transform .05s linear}
.hcur.pinch{width:26px;height:26px;margin:-13px 0 0 -13px;background:var(--hc)}
.hcur.pinch::after{opacity:0}
.hctl{pointer-events:auto;display:none;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 12px;font-size:13px}
body.hand-on .hctl{display:flex}
.hctl input{width:110px;accent-color:#4D8DFF}
.hbtn{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:8px;min-height:32px;padding:0 10px;font:600 13px/1 var(--body);cursor:pointer}
.hfps{min-width:46px;text-align:right;opacity:.8;font-variant-numeric:tabular-nums}
#hcur0{--hc:#4D8DFF}
#hcur1{--hc:#FF9A3C}
.hand-dock{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:61;display:none;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 28px);pointer-events:none}
.hand-dock.on{display:flex}
#hvid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(-1.12,1.12);z-index:0;display:none;pointer-events:none;background:#000}
#hfull{position:fixed;inset:0;width:100%;height:100%;z-index:52;pointer-events:none;display:none}
body.hand-on{background:#000}
body.hand-on #hvid,body.hand-on #hfull{display:block}
body.hand-on .shell{position:relative;z-index:1}

<body class="mode-build">
<div class="shell">
<header class="top">
  <p class="brand">Bond Bench <span class="ver">v5 · 1 Oct</span></p>
  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" type="button" role="tab" id="tab-build" data-cmd="mode" data-mode="build" aria-selected="true">Build</button>
    <button class="tab" type="button" role="tab" id="tab-pair" data-cmd="mode" data-mode="pair" aria-selected="false">Pair up</button>
  </div>
  <button class="btn ghost hand-btn" type="button" id="handBtn" data-cmd="hand" aria-pressed="false">Hand control</button>
</header>
<main>
  <section class="view build" id="buildView" aria-label="Build molecules">
    <aside class="shelf" aria-label="Atoms and molecules">
      <div class="seg" role="tablist" aria-label="Shelf">
        <button type="button" role="tab" data-cmd="shelf" data-shelf="atoms" aria-selected="true">Atoms</button>
        <button type="button" role="tab" data-cmd="shelf" data-shelf="mols" aria-selected="false">Molecules</button>
      </div>
      <div class="pal" id="palAtoms"></div>
      <div class="pal mols" id="palMols" hidden></div>
      <p class="shelf-note" id="shelfNote">Tap to add, or drag onto the bench.</p>
    </aside>
    <div class="stage" id="stage">
      <canvas id="bcv" role="img" aria-label="Molecule bench"></canvas>
      <div class="tools" role="toolbar" aria-label="Bench tools">
        <button class="tb" type="button" data-cmd="undo" id="tUndo">Undo</button>
        <button class="tb" type="button" data-cmd="fillh" id="tFill">Add H</button>
        <button class="tb" type="button" data-cmd="tidy">Tidy</button>
        <button class="tb" type="button" data-cmd="fit">Fit</button>
        <button class="tb" type="button" data-cmd="del" id="tDel">Delete</button>
        <button class="tb" type="button" data-cmd="clear" id="tClear">Clear</button>
        <button class="tb" type="button" data-cmd="pull" id="tPull" aria-pressed="false">Pull bonds</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <aside class="binfo" id="binfo" aria-live="polite" aria-label="Details"></aside>
  </section>

  <section class="view app" id="pairView" aria-label="Pair up two elements" hidden>
    <div class="layout">
      <section class="table-wrap" aria-label="Periodic table">
        <div class="pt" id="pt">
          <div class="intro"><div><h2>Pair up</h2><p>Tap two elements, press Combine, and see how they bond.</p></div></div>
        </div>
        <ul class="legend" id="legend"></ul>
      </section>
      <aside class="bench" aria-label="Bench">
        <div class="slots" id="slots"></div>
        <div class="actions">
          <button class="btn grow" id="combine" data-act="combine" disabled>Combine</button>
          <button class="btn ghost" data-act="clear">Clear</button>
        </div>
        <div id="result" aria-live="polite"></div>
      </aside>
    </div>
  </section>
</main>
</div>

<div class="overlay" id="elOverlay" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <div class="ov-panel">
    <div class="ov-head"><h2 id="ovTitle">Pick any element</h2><button class="btn ghost" type="button" data-cmd="ovclose">Close</button></div>
    <div class="table-wrap"><div class="pt" id="pt2"></div></div>
  </div>
</div>

<div id="ghost" aria-hidden="true"></div>
<video id="hvid" playsinline muted></video>
<canvas id="hfull" aria-hidden="true"></canvas>
<div class="hcur" id="hcur0" aria-hidden="true"></div>
<div class="hcur" id="hcur1" aria-hidden="true"></div>
<div class="hand-dock" id="hdock">
  <div class="hctl"><label for="hsens"><b>Pinch</b></label><span>firm</span><input type="range" id="hsens" min="0" max="1" step="0.05" value="0.5" aria-label="Pinch sensitivity"><span>easy</span><button type="button" class="hbtn" data-cmd="hands" id="hHands">2 hands</button><span class="hfps" id="hfps"></span></div>
  <div class="hstat" id="hstat" hidden><span id="hmsg"></span><button type="button" data-cmd="hclose">Close</button></div>
</div>

function gcd(a,b){return b?gcd(b,a%b):a;}
function rnd(x){return Math.round(x*100)/100;}

/* ---------- Diagrams ---------- */
function catVar(s){return 'var(--c-'+EL[s].c+')';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function norm(a){return ((a%360)+360)%360;}
function gap(occ){
  if(!occ.length) return {mid:270,size:360};
  var s=occ.map(norm).sort(function(x,y){return x-y;}),best={size:-1,mid:0};
  for(var i=0;i<s.length;i++){
    var a0=s[i],a1=i+1<s.length?s[i+1]:s[0]+360,sz=a1-a0;
    if(sz>best.size)best={size:sz,mid:a0+sz/2};

function molSVG(mol){

  mol.bonds.forEach(function(b){
    var p=A[b[0]],q=A[b[1]],ang=Math.atan2(q.y-p.y,q.x-p.x)/rad;
    p.occ.push(ang);q.occ.push(ang+180);
  });
  A.forEach(function(a){
    if(a.h||!a.lp)return;
    var g=gap(a.occ),sp=Math.min(g.size/(a.lp+1),90);
    for(var k=0;k<a.lp;k++)a.lps.push(g.mid+(k-(a.lp-1)/2)*sp);
  });
  mol.bonds.forEach(function(b){
    var p=A[b[0]],q=A[b[1]];
    if(p.h||q.h)return;
    var d=dEN(EL[p.s],EL[q.s]);
    if(d>=0.4){ if(EL[p.s].en>EL[q.s].en){p.dl--;q.dl++;}else{p.dl++;q.dl--;} }
  });
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  A.forEach(function(a){minX=Math.min(minX,a.x);maxX=Math.max(maxX,a.x);minY=Math.min(minY,a.y);maxY=Math.max(maxY,a.y);});
  var pad=46,W=Math.max(320,maxX-minX+pad*2),H=Math.max(180,maxY-minY+pad*2);
  var cx=(minX+maxX)/2,cy=(minY+maxY)/2,vx=cx-W/2,vy=cy-H/2;
  var svg='<svg class="dia" viewBox="'+vx+' '+vy+' '+W+' '+H+'" role="img" aria-label="Bond diagram">';
  mol.bonds.forEach(function(b){
    var p=A[b[0]],q=A[b[1]],o=b[2],dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,px=-uy,py=ux;
    var offs=o===1?[0]:(o===2?[-3.6,3.6]:[-6.5,0,6.5]),faded=p.h||q.h;
    offs.forEach(function(off){
      svg+='<line x1="'+(p.x+px*off)+'" y1="'+(p.y+py*off)+'" x2="'+(q.x+px*off)+'" y2="'+(q.y+py*off)+'" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"'+(faded?' opacity=".35" stroke-dasharray="3 5"':'')+'/>';
    });
  });
  A.forEach(function(a){
    if(a.h)return;
    var r=a.s==='H'?13:R;
    svg+='<circle cx="'+a.x+'" cy="'+a.y+'" r="'+r+'" style="fill:'+catVar(a.s)+'" stroke="var(--ink)" stroke-width="1.6"/>';
    svg+='<text x="'+a.x+'" y="'+a.y+'" dy=".35em" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="700" font-size="'+(a.s.length>1?14:16)+'" style="fill:var(--cell-ink)">'+a.s+'</text>';
    a.lps.forEach(function(t){
      var ux=Math.cos(t*rad),uy=Math.sin(t*rad),px=-uy,py=ux,ccx=a.x+ux*(R+8),ccy=a.y+uy*(R+8);
      svg+='<circle cx="'+(ccx+px*3.3)+'" cy="'+(ccy+py*3.3)+'" r="2.4" fill="var(--lp)"/><circle cx="'+(ccx-px*3.3)+'" cy="'+(ccy-py*3.3)+'" r="2.4" fill="var(--lp)"/>';
    });
    if(a.dl!==0){
      var g=gap(a.occ.concat(a.lps)),t=g.mid*rad;
      svg+='<text x="'+(a.x+Math.cos(t)*(R+16))+'" y="'+(a.y+Math.sin(t)*(R+16))+'" dy=".35em" text-anchor="middle" font-size="14" font-weight="700" style="fill:'+(a.dl<0?'var(--dneg)':'var(--dpos)')+'">'+(a.dl<0?'δ−':'δ+')+'</text>';
    }

function ionSVG(e){
  var cat=e.ions[0],an=e.ions[1],seq=[],c=cat.n,a=an.n,t=an.n>=cat.n?1:0;
  while(c>0||a>0){
    if(t===1&&a>0){seq.push(an);a--;}
    else if(t===0&&c>0){seq.push(cat);c--;}
    else if(a>0){seq.push(an);a--;}
    else{seq.push(cat);c--;}
    t=1-t;
  }
  var rc=26,ra=36,gapPx=4,total=0;
  seq.forEach(function(i){total+=2*(i.c>0?rc:ra);});total+=gapPx*(seq.length-1);
  var W=Math.max(320,total+60),H=180,cy=92,x=(W-total)/2;
  var svg='<svg class="dia" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ion diagram">';
  seq.forEach(function(i){
    var r=i.c>0?rc:ra,cx=x+r;
    svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" style="fill:'+catVar(i.s)+'" stroke="var(--ink)" stroke-width="1.8"/>';
    svg+='<text x="'+cx+'" y="'+cy+'" dy=".35em" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="700" font-size="20" style="fill:var(--cell-ink)">'+i.s+'</text>';
    var bx=cx+r*.72,by=cy-r*.72;
    svg+='<circle cx="'+bx+'" cy="'+by+'" r="12" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.5"/>';
    svg+='<text x="'+bx+'" y="'+by+'" dy=".35em" text-anchor="middle" font-size="12" font-weight="700" style="fill:var(--ink)">'+chg(i.c)+'</text>';
    var ne=Math.abs(i.c);

    else svg+='<text x="'+cx+'" y="'+(cy+r+20)+'" text-anchor="middle" font-size="12.5" style="fill:var(--ink2)">gains '+ne+' e⁻</text>';

function metalSVG(e){
  var W=340,H=210,cols=4,rows=3,dx=68,dy=58,x0=(W-(cols-1)*dx)/2,y0=(H-(rows-1)*dy)/2;
  var m=e.metals,two=m.length>1,svg='<svg class="dia" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Metallic bonding diagram">';

  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var idx=two?((c+r)%2):0,s=m[idx],rr=two?(idx===big?26:22):24,x=x0+c*dx,y=y0+r*dy;
    svg+='<circle cx="'+x+'" cy="'+y+'" r="'+rr+'" style="fill:'+catVar(s)+'" stroke="var(--ink)" stroke-width="1.6"/>';
    svg+='<text x="'+x+'" y="'+(y-1)+'" dy=".35em" text-anchor="middle" font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="700" font-size="15" style="fill:var(--cell-ink)">'+s+'</text>';
    svg+='<text x="'+x+'" y="'+(y+13)+'" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--cell-ink)">+</text>';
  }
  if(e.inter){

  }

  for(var r2=0;r2<rows;r2++)for(var c2=0;c2<cols;c2++){

function elec(x,y,k){

function diagram(e){
  if(e.type==='ionic')return ionSVG(e);

}
function caption(e){
  if(e.type==='ionic')return 'Ions are drawn as circles: the positive ions are smaller than the negative ions. Numbers show the electrons moved.';
  if(e.type==='metallic')return 'Circles are positive metal ions. The red dots are delocalised electrons, free to move through the lattice.';
  if(e.type==='network')return 'Every line is a shared pair of electrons. Faded lines show the structure continuing in every direction.';

/* ---------- Explanation text ---------- */
function whyBond(e,a,b,d){
  var t=[];
  if(e.type==='ionic'){
    var c=e.ions[0],n=e.ions[1],lose=Math.abs(c.c),gain=Math.abs(n.c);
    t.push('Each '+EL[c.s].n.toLowerCase()+' atom gives away '+lose+' electron'+(lose>1?'s':'')+' and becomes '+ion(c)+'. Each '+EL[n.s].n.toLowerCase()+' atom takes '+gain+' electron'+(gain>1?'s':'')+' and becomes '+ion(n)+'.');
    t.push('The strong electrostatic attraction between these oppositely charged ions, acting in every direction, is the ionic bond. It builds a giant lattice rather than separate molecules.');
    if(c.n>1||n.n>1) t.push(c.n+' × '+ion(c)+' and '+n.n+' × '+ion(n)+' give a total charge of zero, which is why the formula is '+fmtF(e.f)+'.');
  } else if(e.type==='metallic'){
    t.push('Metal atoms release their outer electrons into a shared “sea”. The positive ions sit in a regular lattice, held together by their attraction to these delocalised electrons.');
    t.push('Because the electrons can move, metals conduct. Because the layers of ions can slide without breaking that attraction, metals can be bent and shaped.');
  } else if(e.type==='network'){
    t.push('Every atom is joined to its neighbours by strong covalent bonds in all directions, forming one giant structure. There are no separate molecules, so a huge amount of energy is needed to break it apart.');
  } else {
    var cnt={1:0,2:0,3:0};
    e.mol.bonds.forEach(function(bd){if(!e.mol.atoms[bd[0]][4]&&!e.mol.atoms[bd[1]][4])cnt[bd[2]]++;});
    var parts=[];
    if(cnt[1])parts.push(cnt[1]+' single bond'+(cnt[1]>1?'s':''));
    if(cnt[2])parts.push(cnt[2]+' double bond'+(cnt[2]>1?'s':''));
    if(cnt[3])parts.push(cnt[3]+' triple bond'+(cnt[3]>1?'s':''));
    t.push('The atoms share pairs of electrons: '+parts.join(' and ')+'. Each shared pair is one covalent bond.');
  }
  if(e.type==='polar'||e.type==='nonpolar'||e.type==='network'){
    if(a.s===b.s) t.push('Both atoms are the same element, so they pull on the shared electrons equally (ΔEN 0).');
    else if(d>=0.4){
      var hi=a.en>b.en?a:b,lo=hi===a?b:a;
      t.push(hi.n+' is more electronegative than '+lo.n.toLowerCase()+' (ΔEN '+d+'), so it pulls the shared electrons towards itself. It becomes slightly negative (δ−) and '+lo.n.toLowerCase()+' slightly positive (δ+).');
    } else t.push(a.n+' and '+b.n.toLowerCase()+' have almost the same electronegativity (ΔEN '+d+'), so the electrons are shared about equally.');
  }
  return t;
}
function row(k,v){return v?'<div class="r"><dt>'+k+'</dt><dd>'+v+'</dd></div>':'';}
function props(e){
  var defCond=e.type==='ionic'?'Does not conduct as a solid; conducts when molten or dissolved':(e.type==='metallic'?'Conducts (delocalised electrons)':GAS_COND);
  var defStruct=e.type==='ionic'?'Giant ionic lattice':(e.type==='metallic'?'Lattice of positive ions in a sea of delocalised electrons':(e.type==='network'?'':'Simple molecules: strong covalent bonds inside each molecule, weak forces between molecules'));
  var h='<dl class="props">';
  h+=row('State at room temperature',e.state);
  h+=row('Melting point',fmtT(e.mp));
  h+=row('Boiling point',fmtT(e.bp));
  h+=row('Melting and boiling',e.mb);
  h+=row('In water',e.sol);
  h+=row('Conducts electricity?',e.cond||defCond);
  h+=row('Shape',e.shape);
  h+=row('Polarity',e.polarity);

/* ---------- UI state ---------- */
var picks=[],state={list:null,idx:0,open:false};
var $=function(id){return document.getElementById(id);};

function buildTable(){
  var pt=$('pt'),h='';
  LIST.forEach(function(e){
    var p=pos(e.z);
    h+='<button class="el" type="button" data-act="pick" data-s="'+e.s+'" aria-pressed="false" aria-label="'+e.n+'" title="'+e.n+'" style="grid-row:'+p[0]+';grid-column:'+p[1]+';--cat:var(--c-'+e.c+')"><span class="n">'+e.z+'</span><span class="s">'+e.s+'</span></button>';
  });

  h+='<div class="ph" style="grid-row:7;grid-column:3;--cat:var(--c-act)" aria-hidden="true">89–103</div>';
  pt.insertAdjacentHTML('beforeend',h);
  var lg='';
  Object.keys(CATNAME).forEach(function(k){lg+='<li style="--cat:var(--c-'+k+')"><i></i>'+CATNAME[k]+'</li>';});

}
function slotHTML(i){

}
function quickHTML(){
  var pairs=[['Na','Cl'],['H','O'],['C','O'],['Mg','O'],['C','H'],['Fe','O']],h='<div class="quick"><p>Not sure where to start? Try one of these.</p><div class="chips">';
  pairs.forEach(function(p){h+='<button class="chip" type="button" data-act="quick" data-a="'+p[0]+'" data-b="'+p[1]+'">'+p[0]+' + '+p[1]+'</button>';});
  return h+'</div></div>';
}
function gaugeHTML(a,b,d){
  var hi=a.en>=b.en?a:b,lo=hi===a?b:a,pct=Math.min(d/3.3,1)*100;
  return '<div class="gauge"><div class="track"><span class="seg np"></span><span class="seg po"></span><span class="seg io"></span><i class="mark" style="left:'+pct+'%"></i></div><div class="gl"><span>Non-polar</span><span>Polar</span><span>Ionic</span></div><p class="den">ΔEN = '+d+' ('+hi.s+' '+hi.en+' − '+lo.s+' '+lo.en+')</p></div>';
}
function renderResult(){
  var box=$('result');
  if(!state.list){box.innerHTML=quickHTML();return;}
  var L=state.list,e=L[state.idx],a=EL[picks[0]],b=EL[picks[1]];
  if(e.none){box.innerHTML='<div class="result"><div class="card"><p>'+e.msg+'</p></div></div>';return;}
  var T=TYPES[e.type],d=dEN(a,b),h='<div class="result">';
  h+='<div class="head"><div><div class="formula'+(e.f.length>8?' long':'')+'">'+fmtF(e.f)+'</div><div class="cname">'+e.name+'</div></div><span class="pill" style="--t:var('+T.v+')">'+T.label+'</span></div>';
  if(L.length>1){
    h+='<div class="chips" role="group" aria-label="Possible compounds">';
    L.forEach(function(x,i){h+='<button class="chip" type="button" data-act="alt" data-i="'+i+'" aria-pressed="'+(i===state.idx)+'">'+fmtF(x.f)+(x.name?' ('+x.name.replace(/ \(.*\)/,'')+')':'')+'</button>';});
    h+='</div>';
  }
  if(e.predicted) h+='<p class="note">This is a prediction from typical charges and valencies, not a checked entry in the compound library. Treat the details as a guide.</p>';
  h+=diagram(e)+'<p class="cap">'+caption(e)+'</p>';
  if(e.type!=='metallic') h+=gaugeHTML(a,b,d);
  h+='<button class="btn" type="button" data-act="explain" aria-expanded="'+state.open+'">'+(state.open?'Hide explanation':'Explain this compound')+'</button>';
  if(state.open){
    var why=whyBond(e,a,b,d);
    h+='<div class="details" id="details"><section><h3>How the atoms are held together</h3>';
    why.forEach(function(p){h+='<p>'+p+'</p>';});
    if(e.why)h+='<p>'+e.why+'</p>';
    h+='</section><section><h3>Physical properties</h3>'+props(e)+'</section>';
    if(e.chem&&e.chem.length){h+='<section><h3>Chemical characteristics</h3><ul>';e.chem.forEach(function(c){h+='<li>'+c+'</li>';});h+='</ul></section>';}
    h+='</div>';
  }

}
function update(){
  document.querySelectorAll('#pt .el').forEach(function(b){b.setAttribute('aria-pressed',picks.indexOf(b.dataset.s)>-1?'true':'false');});
  $('slots').innerHTML=slotHTML(0)+'<span class="plus" aria-hidden="true">+</span>'+slotHTML(1);
  $('combine').disabled=picks.length<2;
  renderResult();
}
function pick(s){
  picks.push(s);if(picks.length>2)picks.shift();
  state.list=null;update();
}
function reduced(){return window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}
function combine(){
  if(picks.length<2)return;
  state.list=resolve(EL[picks[0]],EL[picks[1]]);state.idx=0;state.open=false;
  update();
  var r=$('result');
  if(r&&r.scrollIntoView)r.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'nearest'});
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest&&ev.target.closest('[data-act]');
  if(!t)return;
  var act=t.dataset.act;
  if(act==='pick')pick(t.dataset.s);
  else if(act==='remove'){picks.splice(+t.dataset.i,1);state.list=null;update();}
  else if(act==='combine')combine();
  else if(act==='clear'){picks.length=0;state.list=null;update();}
  else if(act==='alt'){state.idx=+t.dataset.i;renderResult();}
  else if(act==='quick'){picks.splice(0,picks.length,t.dataset.a,t.dataset.b);combine();}
  else if(act==='explain'){
    state.open=!state.open;renderResult();
    var d=$('details');
    if(d&&d.scrollIntoView)d.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});
  }

/* ---------- Canvas pointer handling (touch, pen, mouse and hand) ---------- */

}

/* Hand tracking runs in a background worker when the browser allows it, so the app stays smooth */
function initWorker(){
  return new Promise(function(res){
    if(!window.Worker||!window.createImageBitmap){res(null);return;}
    var w;try{w=new Worker(URL.createObjectURL(new Blob([WK_SRC],{type:'text/javascript'})),{type:'module'});}catch(e){res(null);return;}
    var done=false,to=setTimeout(function(){fin(null);},30000);
    function fin(x){if(done)return;done=true;clearTimeout(to);if(!x){try{w.terminate();}catch(e){}}res(x);}
    w.onmessage=function(e){var m=e.data;
      if(m.t==='ready'){if(m.dg!=='GPU'){fin(null);return;}
        w.onmessage=function(ev){var r=ev.data;if(r.t!=='res')return;HT.wbusy=false;if(!HT.on)return;hCount();hProcess({landmarks:r.lm},performance.now());};
        fin(w);}
      else if(m.t==='fail')fin(null);};
    w.onerror=function(){fin(null);};
    w.postMessage({t:'init',mp:MP,model:MP_MODEL,n:HT.nh});

  var b=$('hHands');if(b)b.textContent=n===2?'2 hands':'1 hand';
  if(HT.wk)HT.wk.postMessage({t:'opts',n:n});else if(HT.lm&&HT.lm.setOptions){try{HT.lm.setOptions({numHands:n});}catch(e){}}
  if(n===1&&HT.slots[1].on)hRelease(HT.slots[1]);
}
function hAssign(dets){
  var out=[null,null],sl=HT.slots,act=sl.filter(function(s){return s.on;});
  if(!dets.length)return out;
  var far=Math.hypot(innerWidth,innerHeight)*0.4;
  function dd(s,h){return Math.hypot(s.x-h.ax,s.y-h.ay);}
  function free(){for(var i=0;i<2;i++)if(!sl[i].on&&!out[i])return sl[i];return null;}
  if(dets.length===1){
    var h=dets[0],best=null,bd=1e9;
    act.forEach(function(s){var d=dd(s,h);if(d<bd){bd=d;best=s;}});
    var f=free();
    if(best&&(bd<far||!f))out[best.i]=h;else out[(f||sl[0]).i]=h;
    return out;
  }
  if(act.length===2){
    var straight=dd(sl[0],dets[0])+dd(sl[1],dets[1]),cross=dd(sl[0],dets[1])+dd(sl[1],dets[0]);
    if(straight<=cross){out[0]=dets[0];out[1]=dets[1];}else{out[0]=dets[1];out[1]=dets[0];}
    return out;
  }
  if(act.length===1){
    var a=act[0],i0=dd(a,dets[0])<=dd(a,dets[1])?0:1;
    out[a.i]=dets[i0];out[1-a.i]=dets[1-i0];
    return out;
  }
  var lo=dets[0].ax<=dets[1].ax?0:1;
  out[0]=dets[lo];out[1]=dets[1-lo];
  return out;
}
function drawHands(dets){
  var c=$('hfull'),g=c.getContext&&c.getContext('2d');if(!g)return;
  g.setTransform(HT.d,0,0,HT.d,0,0);g.clearRect(0,0,innerWidth,innerHeight);
  g.lineCap='round';
  dets.forEach(function(h){
    if(h.slot==null)return;
    var P=h.P,col=HAND_COL[h.slot];
    g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.35)';
    HAND_LINKS.forEach(function(k){g.beginPath();g.moveTo(P[k[0]].x,P[k[0]].y);g.lineTo(P[k[1]].x,P[k[1]].y);g.stroke();});
    g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,.9)';
    HAND_LINKS.forEach(function(k){g.beginPath();g.moveTo(P[k[0]].x,P[k[0]].y);g.lineTo(P[k[1]].x,P[k[1]].y);g.stroke();});
    P.forEach(function(p,i){var tip=i===4||i===8;g.beginPath();g.arc(p.x,p.y,tip?6:3.5,0,TAU);g.fillStyle=tip?col:'#FFFFFF';g.fill();if(tip){g.lineWidth=2;g.strokeStyle='#fff';g.stroke();}});
  });
}
function hProcess(res,now){
  var LM=(res&&res.landmarks)||[],dets=[],vw=HT.vw,vh=HT.vh;
  function dn(a,b){return Math.hypot((a.x-b.x)*vw,(a.y-b.y)*vh,((a.z||0)-(b.z||0))*vw);}
  var sens=HT.sens==null?0.5:HT.sens,lo=0.24+0.22*sens,hi=lo+0.14;
  for(var k=0;k<LM.length&&k<HT.nh;k++){
    var L=LM[k],P=L.map(vmap),h={P:P,slot:null};
    h.ax=(P[4].x+P[8].x)/2;h.ay=(P[4].y+P[8].y)/2;
    var sc=(dn(L[0],L[5])+dn(L[5],L[17])+dn(L[0],L[17]))/3||1;
    h.r=dn(L[4],L[8])/sc;
    dets.push(h);
  }
  var out=hAssign(dets);
  HT.slots.forEach(function(s){
    var h=out[s.i],cur=s.cur;
    if(h){
      h.slot=s.i;
      if(!s.on){s.on=true;s.fx.v=null;s.fy.v=null;s.pinch=false;s.hist=[];s.ox=s.oy=0;s.onN=s.offN=0;s.dx=null;}
      if(!HT.seenAny){HT.seenAny=true;setTimeout(function(){if(HT.on)hMsg('');},3500);}
      s.seen=now;
      s.x=clamp(oe(s.fx,h.ax,now),0,innerWidth);s.y=clamp(oe(s.fy,h.ay,now),0,innerHeight);
      s.hist.push({x:s.x,y:s.y,t:now});if(s.hist.length>10)s.hist.shift();
      var kf=s.pinch?Math.max(0,1-(now-s.offT)/280):0;
      s.px=clamp(s.x+s.ox*kf,0,innerWidth);s.py=clamp(s.y+s.oy*kf,0,innerHeight);
      if(!s.pinch){
        s.onN=h.r<lo?s.onN+1:0;
        if(s.onN>=2){
          var pre=histAt(s,now-120);s.ox=pre.x-s.x;s.oy=pre.y-s.y;s.offT=now;s.px=pre.x;s.py=pre.y;
          s.pinch=true;s.onN=s.offN=0;cur.classList.add('pinch');hDown(s);
        }
      }else{
        s.offN=h.r>hi?s.offN+1:0;
        if(s.offN>=2){
          var pr=histAt(s,now-100);s.px=clamp(pr.x+s.ox*kf,0,innerWidth);s.py=clamp(pr.y+s.oy*kf,0,innerHeight);
          s.pinch=false;s.onN=s.offN=0;cur.classList.remove('pinch');hUp(s);
        }else hMove(s);
      }
      cur.style.display='block';
      cur.style.setProperty('--p',s.pinch?1:clamp((1-h.r)/(1-lo),0,1).toFixed(2));
    }else if(s.on&&now-s.seen>450){hRelease(s);}
  });
  drawHands(dets);
  var set=[],atomHover=null;
  HT.slots.forEach(function(s){
    if(!s.on||s.pinch)return;
    var el=document.elementFromPoint(s.px,s.py);
    if(el===cv){var p=stagePt(s.px,s.py),w=s2w(p.x,p.y),a=hitAtom(w.x,w.y);if(a!=null&&atomHover==null)atomHover=a;}
    else{var b=el&&el.closest?el.closest('button'):null;if(b&&set.indexOf(b)<0)set.push(b);}
  });
  HT.hov.forEach(function(e){if(set.indexOf(e)<0)e.classList.remove('hand-hover');});
  set.forEach(function(e){e.classList.add('hand-hover');});
  HT.hov=set;
  if(!GH&&!DRAG&&HOVER!==atomHover){HOVER=atomHover;redraw();}
}
function hRelease(s){
  if(s.pinch){s.pinch=false;s.cur.classList.remove('pinch');hUp(s);}
  s.on=false;s.cur.style.display='none';
}
function hDown(s){
  var x=s.px,y=s.py,id='hand'+s.i,el=document.elementFromPoint(x,y);s.down=null;if(!el)return;
  if(el===cv){s.down={t:'cv'};cDown(x,y,id);return;}
  var add=el.closest&&el.closest('[data-add]');
  if(add&&!add.closest('.overlay')){s.down={t:'pal',el:add,x0:x,y0:y,drag:false,blocked:false};add.classList.add('hand-press');return;}
  var btn=el.closest&&el.closest('button');
  if(btn){s.down={t:'btn',el:btn};btn.classList.add('hand-press');}
}
function hMove(s){
  var d=s.down;if(!d)return;
  if(d.t==='cv')cMove(s.px,s.py,'hand'+s.i);
  else if(d.t==='pal'){
    if(!d.drag&&!d.blocked&&Math.hypot(s.px-d.x0,s.py-d.y0)>14){
      d.el.classList.remove('hand-press');
      if(GH&&HT.gOwner!==s.i)d.blocked=true;
      else{d.drag=true;HT.gOwner=s.i;ghostStart(d.el.dataset.add);}
    }
    if(d.drag)ghostMove(s.px,s.py);
  }
}
function hUp(s){
  var d=s.down;s.down=null;if(!d)return;
  var x=s.px,y=s.py;
  if(d.t==='cv'){cUp(x,y,'hand'+s.i);return;}
  d.el.classList.remove('hand-press');
  if(d.t==='pal'){if(d.blocked)return;if(d.drag){HT.gOwner=-1;ghostDrop(x,y);}else d.el.click();return;}
  var el=document.elementFromPoint(x,y);if(el&&d.el.contains(el))d.el.click();
}

/* ---------- Wiring ---------- */
function initBuild(){
  cv=$('bcv');ctx=cv.getContext?cv.getContext('2d'):null;
  buildSig();buildShelf();readColors();load();
  cv.addEventListener('pointerdown',function(e){try{cv.setPointerCapture(e.pointerId);}catch(x){}SHIFT=!!e.shiftKey;cDown(e.clientX,e.clientY,e.pointerId);});
  cv.addEventListener('pointermove',function(e){cMove(e.clientX,e.clientY,e.pointerId);});
  cv.addEventListener('pointerup',function(e){cUp(e.clientX,e.clientY,e.pointerId);});
  cv.addEventListener('pointercancel',function(e){cUp(e.clientX,e.clientY,e.pointerId);});
  cv.addEventListener('wheel',function(e){
    e.preventDefault();var p=stagePt(e.clientX,e.clientY),w=s2w(p.x,p.y);
    view.z=clamp(view.z*Math.exp(-e.deltaY*0.0015),0.3,2.5);view.x=w.x-(p.x-W/2)/view.z;view.y=w.y-(p.y-H/2)/view.z;redraw();
  },{passive:false});
  var shelf=document.querySelector('.shelf');
  shelf.addEventListener('pointerdown',function(e){var a=e.target.closest('[data-add]');if(!a)return;PD={el:a,id:e.pointerId,x0:e.clientX,y0:e.clientY,drag:false};});
  window.addEventListener('pointermove',function(e){
    if(!PD||PD.id!==e.pointerId)return;
    if(!PD.drag&&Math.hypot(e.clientX-PD.x0,e.clientY-PD.y0)>10){PD.drag=true;ghostStart(PD.el.dataset.add);}
    if(PD.drag)ghostMove(e.clientX,e.clientY);
  });
  window.addEventListener('pointerup',function(e){if(!PD||PD.id!==e.pointerId)return;var d=PD;PD=null;if(d.drag){suppressClick=Date.now();ghostDrop(e.clientX,e.clientY);}});
  window.addEventListener('pointercancel',function(e){if(PD&&PD.id===e.pointerId){if(PD.drag){$('ghost').style.display='none';GH=null;}PD=null;}});
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('[data-add]');
    if(a){if(Date.now()-suppressClick<500)return;tapAdd(a.dataset.add);if(a.closest('.overlay'))closeOverlay();return;}
    var c=e.target.closest&&e.target.closest('[data-cmd]');if(!c)return;
    var k=c.dataset.cmd;
    if(k==='mode')setMode(c.dataset.mode);
    else if(k==='hand'){if(HT.on||HT.busy)handStop();else handStart();}
    else if(k==='hclose')handStop();
    else if(k==='hands')setHands(HT.nh===2?1:2);
    else if(k==='shelf'){var at=c.dataset.shelf==='atoms';$('palAtoms').hidden=!at;$('palMols').hidden=at;document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-selected',b===c);});}
    else if(k==='allel')openOverlay();
    else if(k==='ovclose')closeOverlay();
    else if(k==='undo')undo();
    else if(k==='fillh'){var ids=SELMOL||allIds();pushUndo();var n=fillH(ids);allMols().forEach(function(m){relax(m,60);});commit();if(n)toast('Added '+n+' hydrogen atom'+(n>1?'s':'')+'.');}
    else if(k==='tidy')tidy();
    else if(k==='pull'){PULL=!PULL;c.setAttribute('aria-pressed',PULL);toast(PULL?'Pull bonds is on: drag an atom to stretch its bonds until one snaps. Drag the empty bench to turn the molecule.':'Pull bonds is off: dragging an atom moves the whole molecule again.');}
    else if(k==='fit')fit();
    else if(k==='del')deleteSel();
    else if(k==='clear'){pushUndo();S={atoms:{},bonds:{},units:{},next:S.next};rebuildAdj();SEL=null;commit();toast('Bench cleared. Undo brings it back.');}
    else if(k==='order')setOrder(SEL&&SEL.t==='bond'?SEL.id:null,+c.dataset.o);
    else if(k==='break'){if(SEL&&SEL.t==='bond'){pushUndo();var bb=S.bonds[SEL.id],keep=bb.a;removeBond(SEL.id);select({t:'atom',id:keep});commit();}}
    else if(k==='hydro'){if(SEL&&SEL.t==='bond'){pushUndo();var b2=S.bonds[SEL.id],nm=linkName(b2),keep2=b2.oh||b2.a;hydrolyse(SEL.id);select({t:'atom',id:keep2});commit();toast(b2.link==='disulfide'?'The bridge broke and each sulfur got a hydrogen back.':'Hydrolysis: water split the '+nm+'.');}}
    else if(k==='delmol'){if(SELMOL){pushUndo();SELMOL.forEach(removeAtom);SEL=null;commit();}}
  });
  $('elOverlay').addEventListener('click',function(e){if(e.target===$('elOverlay'))closeOverlay();});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeOverlay();
    if($('buildView').hidden||/INPUT|TEXTAREA/.test((e.target&&e.target.tagName)||''))return;
    if((e.metaKey||e.ctrlKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();undo();}
    else if((e.key==='Delete'||e.key==='Backspace')&&SEL){e.preventDefault();deleteSel();}
  });
  var hs=$('hsens');if(hs){try{var sv=localStorage.getItem('bondbench-pinch');if(sv!=null)hs.value=sv;}catch(e){}HT.sens=+hs.value;
    try{var nh=+localStorage.getItem('bondbench-hands');if(nh===1||nh===2)setHands(nh);}catch(e){}
    hs.addEventListener('input',function(){HT.sens=+hs.value;try{localStorage.setItem('bondbench-pinch',hs.value);}catch(e){}});}
  if(window.ResizeObserver)new ResizeObserver(function(){resize();}).observe($('stage'));
  window.addEventListener('resize',resize);
  var mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
  if(mq){var f=function(){readColors();redraw();};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f);}
  if(window.MutationObserver)new MutationObserver(function(){readColors();redraw();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','class','style']});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
  var m='build';try{m=localStorage.getItem('bondbench-mode')||'build';}catch(e){}
  setMode(m==='pair'?'pair':'build');
  commit();phyWake();
}



buildTable();
update();
initBuild();
})();
